name: Retry control

on:
  push:
    branches: [retry-control]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      # Public wire contracts retain normal vet; upstream suite caveats are in README.md.
      - run: go test -race -count=1 retry_test.go stream_peer_test.go stream_replay_test.go configuration_test.go
